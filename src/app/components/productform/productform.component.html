<section class="page-heading">
  <div>
    <p class="eyebrow">{{ isEdit ? 'CATALOG UPDATE' : 'GROW YOUR CATALOG' }}</p>
    <h1>{{ isEdit ? 'Edit product' : 'Add a product' }}</h1>
    <p class="page-description">
      {{ isEdit ? 'Make changes to your product details.' : 'Add the details below to create a new catalog item.' }}
    </p>
  </div>
</section>

<section class="surface form-card">
  <div class="surface-heading">
    <div>
      <h2>Product details</h2>
      <p class="surface-subtitle">Fields marked with an asterisk are required.</p>
    </div>
    <span class="form-step">01 <span>/ 01</span></span>
  </div>

  <form class="product-form" (ngSubmit)="onSubmit()" #form="ngForm">
    <div class="form-field">
      <label for="product-name">Product name <span aria-hidden="true">*</span></label>
      <input
        id="product-name"
        type="text"
        [(ngModel)]="product.name"
        name="name"
        placeholder="e.g. Studio headphones"
        required
      />
    </div>

    <div class="form-field">
      <label for="product-description">Description <span aria-hidden="true">*</span></label>
      <textarea
        id="product-description"
        [(ngModel)]="product.description"
        name="description"
        placeholder="Add a short description of this product"
        rows="4"
        required
      ></textarea>
    </div>

    <div class="form-field price-field">
      <label for="product-price">Price <span aria-hidden="true">*</span></label>
      <div class="price-input">
        <span aria-hidden="true">$</span>
        <input
          id="product-price"
          type="number"
          [(ngModel)]="product.price"
          name="price"
          placeholder="0.00"
          min="0"
          step="0.01"
          required
        />
      </div>
    </div>

    <div class="form-actions">
      <a class="button button-secondary" routerLink="/">Cancel</a>
      <button class="button button-primary" type="submit" [disabled]="form.invalid">
        {{ isEdit ? 'Save changes' : 'Create product' }}
      </button>
    </div>
  </form>
</section>
